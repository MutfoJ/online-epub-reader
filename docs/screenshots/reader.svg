<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f4f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="64" y="56" width="1072" height="72" rx="20" fill="#0e1730" opacity="0.92"/>
  <text x="96" y="102" fill="#e8eeff" font-family="ui-sans-serif, system-ui" font-size="22" font-weight="800">Reader</text>
  <text x="186" y="102" fill="#b8c4ff" font-family="ui-sans-serif, system-ui" font-size="14">Chapters · Search · Audio · Settings</text>

  <rect x="1010" y="78" width="100" height="28" rx="12" fill="#4f46e5"/>
  <text x="1060" y="97" text-anchor="middle" fill="#fff" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700">Back</text>

  <!-- Content area -->
  <rect x="64" y="148" width="1072" height="476" rx="28" fill="#0e1730" opacity="0.92"/>

  <!-- Page -->
  <rect x="168" y="180" width="864" height="412" rx="26" fill="url(#paper)"/>

  <text x="210" y="238" fill="#111827" font-family="ui-serif, Georgia, serif" font-size="30" font-weight="800">Chapter 12 — The Long Night</text>

  <!-- Paragraph lines -->
  <g fill="#6b7280" opacity="0.95">
    <rect x="210" y="265" width="780" height="12" rx="6"/>
    <rect x="210" y="290" width="756" height="12" rx="6"/>
    <rect x="210" y="315" width="792" height="12" rx="6"/>

    <rect x="210" y="360" width="784" height="12" rx="6"/>
    <rect x="210" y="385" width="742" height="12" rx="6"/>
    <rect x="210" y="410" width="794" height="12" rx="6"/>

    <rect x="210" y="455" width="772" height="12" rx="6"/>
    <rect x="210" y="480" width="758" height="12" rx="6"/>
    <rect x="210" y="505" width="730" height="12" rx="6"/>
  </g>

  <!-- Progress pill -->
  <rect x="64" y="636" width="190" height="26" rx="13" fill="#101c3a" stroke="#2a3a66"/>
  <text x="159" y="654" text-anchor="middle" fill="#b8c4ff" font-family="ui-sans-serif, system-ui" font-size="12" font-weight="700">38% read · saved locally</text>

  <text x="64" y="30" fill="#9fb0ff" font-family="ui-sans-serif, system-ui" font-size="14"/>
</svg>
